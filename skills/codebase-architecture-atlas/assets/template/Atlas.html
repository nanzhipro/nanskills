* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  transition: background .18s ease, color .18s ease;
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--selection-bg); color: var(--selection-ink); }

/* ---------- 布局骨架 ---------- */
#app { display: flex; height: 100vh; }

/* ---------- 侧边栏 ---------- */
#sidebar {
  width: var(--sidebar-w);
  flex: none;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  background: var(--bg);
  z-index: 30;
}
#sidebar .brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--line);
}
#sidebar .brand .mark {
  display: flex; align-items: center; gap: 9px;
  font-size: 15px; font-weight: 600; letter-spacing: -.01em;
}
#sidebar .brand .mark .dot {
  width: 22px; height: 22px; border-radius: 7px;
  background: var(--ink); color: var(--on-accent);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; letter-spacing: .02em;
}
#sidebar .brand .sub {
  margin-top: 5px; font-size: 11.5px; color: var(--ink-3); letter-spacing: .01em;
}
#nav { flex: 1; overflow-y: auto; padding: 14px 12px; }
#nav .nav-group { margin-bottom: 18px; }
#nav .nav-group-title {
  font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-4); padding: 0 10px 7px;
  display: flex; align-items: baseline; justify-content: space-between;
}
#nav .nav-group-title .layer-tag {
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-4);
  border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; letter-spacing: 0;
}
#nav .nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 7px;
  font-size: 13px; color: var(--ink-2);
  cursor: pointer; user-select: none;
  transition: background .12s ease, color .12s ease;
}
#nav .nav-item:hover { background: var(--bg-hover); color: var(--ink); }
#nav .nav-item.active { background: var(--bg-hover); color: var(--ink); font-weight: 550; }
#nav .nav-item.active .nav-ico { opacity: 1; }
#nav .nav-item .nav-ico {
  width: 15px; height: 15px; flex: none; opacity: .55;
  display: inline-flex; align-items: center; justify-content: center;
}
#nav .nav-item .nav-ico svg { width: 15px; height: 15px; }
#nav .nav-item .nav-meta { margin-left: auto; font-size: 10.5px; color: var(--ink-4); font-family: var(--mono); }
#sidebar .foot {
  border-top: 1px solid var(--line);
  padding: 13px 20px;
  font-size: 11px; color: var(--ink-3);
  display: flex; flex-direction: column; gap: 2px;
}
#sidebar .foot .stats { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }

/* ---------- 主区 ---------- */
#main { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
#topbar {
  flex: none;
  padding: 16px 28px 14px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: flex-end; gap: 18px;
  background: var(--topbar-bg);
  backdrop-filter: blur(8px);
  z-index: 20;
}
#crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
#crumbs .crumb { cursor: pointer; transition: color .12s; }
#crumbs .crumb:hover { color: var(--ink); }
#crumbs .crumb.now { color: var(--ink); font-weight: 550; cursor: default; }
#crumbs .sep { color: var(--ink-4); font-size: 11px; }
#view-title-wrap { display: flex; flex-direction: column; gap: 1px; }
#view-title { font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
#view-desc { font-size: 12.5px; color: var(--ink-3); max-width: 640px; }
#topbar .spacer { flex: 1; }
.top-btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 13px;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--bg); color: var(--ink-2);
  font-size: 12.5px; font-family: var(--sans);
  cursor: pointer; transition: all .12s ease;
}
.top-btn:hover { border-color: var(--line-3); color: var(--ink); background: var(--bg-hover); }
.top-btn kbd {
  font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  background: var(--bg-hover); border: 1px solid var(--line-2);
  border-radius: 4px; padding: 1px 5px;
}

/* ---------- 主题切换 ---------- */
.theme-ctl {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 8px 0 11px;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--bg); color: var(--ink-3);
  cursor: pointer; transition: all .12s ease;
}
.theme-ctl:hover { border-color: var(--line-3); color: var(--ink); background: var(--bg-hover); }
.theme-ctl svg { flex: none; }
.theme-ctl select {
  appearance: none; -webkit-appearance: none; border: none; background: transparent; outline: none;
  font-family: var(--sans); font-size: 12.5px; color: var(--ink-2); cursor: pointer; padding: 0 2px;
}
.theme-ctl select option { color: var(--ink); background: var(--bg); }

/* ---------- 画布 ---------- */
#stage { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
#stage svg { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; -webkit-user-select: none; }
#stage svg.panning { cursor: grabbing; }
/* 拖动时降级重特效:drop-shadow 逐帧重光栅是卡顿主因 */
#stage svg.panning .node-box { filter: none; transition: none; }
#stage svg.panning .edge text { transition: none; }
#viewport { will-change: transform; }
#dotgrid { position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, var(--dotgrid) 1px, transparent 1px);
  background-size: 22px 22px; }

/* SVG 节点 */
.node { cursor: pointer; }
.node .node-box {
  fill: var(--f-fill); stroke: var(--f-stroke); stroke-width: 1;
  transition: stroke .12s ease, filter .12s ease, fill .18s ease;
  filter: drop-shadow(var(--f-shadow));
}
.node:hover .node-box { stroke: var(--f-stroke-hover); filter: drop-shadow(var(--f-shadow-hover)); }
.node.selected .node-box { stroke: var(--f-stroke-sel); stroke-width: 1.6; filter: drop-shadow(var(--f-shadow-sel)); }
.node .node-name { font-size: 13.5px; font-weight: 600; fill: var(--ink); letter-spacing: -.01em; }
.node .node-type { font-size: 9px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; fill: var(--ink-4); }
.node .node-tag { font-size: 11px; fill: var(--ink-3); }
.node .node-priv { font-size: 9px; font-weight: 700; letter-spacing: .06em; fill: var(--on-accent); }
.node .node-drill { font-size: 11px; fill: var(--ink-4); opacity: 0; transition: opacity .12s; }
.node:hover .node-drill { opacity: 1; }
/* 类型形态:旧版按 kind id 绑定(向后兼容,老 data.js 仍可用) */
.node.k-daemon .node-box, .node.k-kernel .node-box { fill: var(--f-black-fill); stroke: var(--f-black-stroke); }
.node.k-daemon .node-name, .node.k-kernel .node-name { fill: var(--f-black-ink); }
.node.k-daemon .node-type, .node.k-kernel .node-type { fill: var(--f-black-ink-3); }
.node.k-daemon .node-tag, .node.k-kernel .node-tag { fill: var(--f-black-ink-2); }
.node.k-daemon .node-drill, .node.k-kernel .node-drill { fill: var(--f-black-ink-4); }
.node.k-sysex .node-box, .node.k-appex .node-box { fill: var(--f-fill-gray); stroke: var(--f-stroke-gray); }
.node.k-service .node-box { fill: var(--f-fill); stroke: var(--f-stroke-strong); stroke-width: 1.2; }
.node.k-worker .node-box, .node.k-xpc .node-box { fill: var(--f-fill-muted); stroke: var(--f-stroke-muted); stroke-dasharray: 4 3; }
.node.k-lib .node-box, .node.k-engine .node-box { fill: var(--f-fill); stroke: var(--f-stroke-dashed); stroke-dasharray: 5 3; }
.node.k-external .node-box { fill: var(--f-fill-ext); stroke: var(--f-stroke-ext); stroke-dasharray: 2 3; }
.node.k-store .node-box { fill: var(--f-fill-muted); stroke: var(--f-stroke-store); }
.node.k-cli .node-box, .node.k-tool .node-box { fill: var(--f-fill); stroke: var(--f-stroke-strong); }
.node.k-cli .node-name, .node.k-tool .node-name { font-family: var(--mono); font-size: 12.5px; font-weight: 550; }
.node.k-cicd .node-box { fill: var(--f-fill); stroke: var(--f-stroke-strong); }
.node.k-artifact .node-box { fill: var(--f-fill-artifact); stroke: var(--f-stroke-store); }
/* 形态原语(协议层):kind 通过 form 字段引用;新增语义 kind 无需再改 CSS */
.node.k-f-black .node-box { fill: var(--f-black-fill); stroke: var(--f-black-stroke); }
.node.k-f-black .node-name { fill: var(--f-black-ink); }
.node.k-f-black .node-type { fill: var(--f-black-ink-3); }
.node.k-f-black .node-tag { fill: var(--f-black-ink-2); }
.node.k-f-black .node-drill { fill: var(--f-black-ink-4); }
.node.k-f-bold .node-box { fill: var(--f-fill); stroke: var(--f-stroke-strong); stroke-width: 1.2; }
.node.k-f-dashed .node-box { fill: var(--f-fill); stroke: var(--f-stroke-dashed); stroke-dasharray: 5 3; }
.node.k-f-dashedgray .node-box { fill: var(--f-fill-muted); stroke: var(--f-stroke-muted); stroke-dasharray: 4 3; }
.node.k-f-gray .node-box { fill: var(--f-fill-gray); stroke: var(--f-stroke-gray); }
.node.k-f-ext .node-box { fill: var(--f-fill-ext); stroke: var(--f-stroke-ext); stroke-dasharray: 2 3; }
.node.k-f-store .node-box { fill: var(--f-fill-muted); stroke: var(--f-stroke-store); }
.node.k-f-mono .node-box { fill: var(--f-fill); stroke: var(--f-stroke-strong); }
.node.k-f-mono .node-name { font-family: var(--mono); font-size: 12.5px; font-weight: 550; }
.node.k-f-cicd .node-box { fill: var(--f-fill); stroke: var(--f-stroke-strong); }
.node.k-f-artifact .node-box { fill: var(--f-fill-artifact); stroke: var(--f-stroke-store); }
.node.dim { opacity: .28; }
.node .root-badge { fill: var(--root-badge-fill); }
.node.flow-hit .node-box { stroke: var(--f-stroke-sel); stroke-width: 2; }

/* SVG 边 */
.edge path.wire { fill: none; stroke: var(--edge); stroke-width: 1.2; transition: stroke .12s; }
.edge path.hitzone { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.edge text { font-size: 10px; fill: var(--edge-label); paint-order: stroke; stroke: var(--edge-label-halo); stroke-width: 3.5px; letter-spacing: .01em; }
.edge:hover path.wire { stroke: var(--edge-hover); }
.edge.selected path.wire { stroke: var(--edge-sel); stroke-width: 1.8; }
.edge.selected text { fill: var(--edge-label-sel); font-weight: 600; }
.edge.k-kernel path.wire { stroke-width: 2.2; stroke: var(--edge-mid); }
.edge.k-net path.wire, .edge.k-notify path.wire { stroke-dasharray: 5 4; }
.edge.k-notify path.wire { stroke-dasharray: 1.5 4; stroke-linecap: round; }
.edge.k-build path.wire { stroke: var(--edge-build); stroke-dasharray: 3 3; }
.edge.dim { opacity: .18; }
.edge.flow-hit path.wire { stroke: var(--edge-sel); stroke-width: 2; }

/* 箭头 marker 颜色(令牌化,随主题切换) */
#canvas marker#arrow path { fill: var(--edge); }
#canvas marker#arrow-mid path { fill: var(--edge-mid); }
#canvas marker#arrow-dark path { fill: var(--edge-dark); }
#flowcanvas marker#seq-arrow path { fill: var(--seq-line); }
#flowcanvas marker#seq-arrow-hot path { fill: var(--seq-hot); }

/* 组框 */
.group-box { fill: none; stroke: var(--group-stroke); stroke-width: 1; stroke-dasharray: 6 4; rx: 14; }
.group-label { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink-4); }
.group-sub { font-size: 10px; fill: var(--ink-4); }

/* ---------- 浮动控件 ---------- */
.fab {
  position: absolute; z-index: 15;
  background: var(--fab-bg); backdrop-filter: blur(8px);
  border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: var(--shadow-1);
}
#zoomctl { right: 18px; bottom: 18px; display: flex; align-items: center; padding: 4px; gap: 2px; }
#zoomctl button {
  width: 30px; height: 30px; border: none; background: transparent; border-radius: 7px;
  font-size: 15px; color: var(--ink-2); cursor: pointer;
}
#zoomctl button:hover { background: var(--bg-hover); color: var(--ink); }
#zoomctl .zoom-val { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); min-width: 44px; text-align: center; cursor: pointer; border-radius: 6px; padding: 4px 2px; }
#zoomctl .zoom-val:hover { background: var(--bg-hover); color: var(--ink); }
#legend { left: 18px; bottom: 18px; padding: 12px 14px; max-width: 320px; font-size: 11px; color: var(--ink-2); }
#legend .legend-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 11.5px; cursor: pointer; user-select: none; }
#legend .legend-head .chev { margin-left: auto; color: var(--ink-4); transition: transform .15s; font-size: 10px; }
#legend.closed .legend-body { display: none; }
#legend.closed .legend-head .chev { transform: rotate(-90deg); }
#legend .legend-body { margin-top: 9px; display: flex; flex-direction: column; gap: 8px; }
#legend .legend-row { display: flex; flex-wrap: wrap; gap: 5px 12px; }
#legend .lg { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); white-space: nowrap; }
#legend .lg .sw { width: 14px; height: 10px; border-radius: 3px; border: 1px solid var(--f-stroke-muted); background: var(--f-fill); flex: none; }
#legend .lg .sw.f-dark { background: var(--f-black-fill); border-color: var(--f-black-fill); }
#legend .lg .sw.f-gray { background: var(--f-fill-ext); }
#legend .lg .sw.dash { border-style: dashed; }
#legend .lg .ln { width: 18px; flex: none; border-top: 2px solid var(--legend-line); height: 0; }
#legend .lg .ln.dash { border-top-style: dashed; border-top-width: 1.5px; }
#legend .lg .ln.dot { border-top-style: dotted; border-top-width: 1.5px; }
#legend .lg .ln.thin { border-top-width: 1px; border-color: var(--edge-build); }

/* ---------- 详情抽屉 ---------- */
#drawer {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: var(--drawer-w);
  background: var(--bg);
  border-left: 1px solid var(--line);
  box-shadow: var(--drawer-shadow);
  transform: translateX(102%);
  transition: transform .26s cubic-bezier(.32,.72,.28,1);
  z-index: 25;
  display: flex; flex-direction: column;
}
#drawer.open { transform: translateX(0); }
#drawer-head {
  flex: none; padding: 20px 22px 16px; border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 9px;
}
#drawer-head .d-types { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-2); background: var(--bg-hover);
  border: 1px solid var(--line-2); border-radius: 5px; padding: 2.5px 7px;
}
.chip.dark { background: var(--ink); color: var(--on-accent); border-color: var(--ink); }
.chip.mono { font-family: var(--mono); text-transform: none; letter-spacing: 0; font-weight: 500; }
#drawer-title { font-size: 19px; font-weight: 650; letter-spacing: -.02em; line-height: 1.3; }
#drawer-tagline { font-size: 12.5px; color: var(--ink-3); }
#drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 30px; }
#drawer-body section { margin-bottom: 22px; }
#drawer-body h4 {
  font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-4); margin-bottom: 9px;
}
#drawer-body p.desc { font-size: 13px; color: var(--ink-2); line-height: 1.75; }
#drawer-body ul.resp { list-style: none; display: flex; flex-direction: column; gap: 6px; }
#drawer-body ul.resp li {
  font-size: 12.5px; color: var(--ink-2); padding-left: 14px; position: relative; line-height: 1.65;
}
#drawer-body ul.resp li::before { content: ""; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-4); }
.file-row {
  font-family: var(--mono); font-size: 10.8px; color: var(--ink-2);
  background: var(--bg-subtle); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 9px; margin-bottom: 5px;
  overflow-wrap: anywhere; line-height: 1.55;
}
.rel-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 7px 9px; border-radius: 7px; cursor: pointer;
  transition: background .12s;
}
.rel-row:hover { background: var(--bg-hover); }
.rel-row .rel-dir { font-size: 11px; color: var(--ink-4); flex: none; font-family: var(--mono); width: 16px; }
.rel-row .rel-name { font-size: 12.5px; font-weight: 550; color: var(--ink); flex: none; }
.rel-row .rel-label { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel-kind-tag {
  flex: none; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; color: var(--ink-3);
}
.note-row {
  font-size: 12px; color: var(--ink-2); line-height: 1.7;
  border-left: 2px solid var(--line-2); padding: 2px 0 2px 11px; margin-bottom: 8px;
}
.note-row b { color: var(--ink); }
.deploy-grid { display: grid; grid-template-columns: 76px 1fr; gap: 6px 12px; font-size: 12px; }
.deploy-grid dt { color: var(--ink-4); }
.deploy-grid dd { color: var(--ink-2); overflow-wrap: anywhere; }
#drawer-actions { flex: none; border-top: 1px solid var(--line); padding: 13px 22px; display: flex; gap: 9px; }
.d-btn {
  flex: 1; height: 34px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--bg); font-size: 12.5px; font-weight: 550; color: var(--ink);
  cursor: pointer; transition: all .12s; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.d-btn:hover { background: var(--bg-hover); border-color: var(--line-3); }
.d-btn.primary { background: var(--ink); color: var(--on-accent); border-color: var(--ink); }
.d-btn.primary:hover { background: var(--accent-hover); }
#drawer-close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent;
  color: var(--ink-3); font-size: 15px; cursor: pointer;
}
#drawer-close:hover { background: var(--bg-hover); color: var(--ink); }

/* ---------- 数据流视图 ---------- */
#flowwrap { flex: 1; display: none; min-height: 0; }
#flowwrap.on { display: flex; }
#flowlist {
  width: 262px; flex: none; border-right: 1px solid var(--line);
  overflow-y: auto; padding: 16px 12px;
}
.flow-item {
  padding: 11px 13px; border-radius: 9px; cursor: pointer; margin-bottom: 4px;
  border: 1px solid transparent; transition: all .12s;
}
.flow-item:hover { background: var(--bg-hover); }
.flow-item.active { background: var(--bg-hover); border-color: var(--line-2); }
.flow-item .f-name { font-size: 13px; font-weight: 550; display: flex; align-items: center; gap: 8px; }
.flow-item .f-name .f-idx {
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-4);
  border: 1px solid var(--line-2); border-radius: 4px; width: 20px; height: 16px;
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.flow-item .f-desc { font-size: 11px; color: var(--ink-3); margin-top: 3px; line-height: 1.5; }
#flowstage { flex: 1; overflow: auto; position: relative; }
#flowstage svg { display: block; }
.seq-lane-name { font-size: 12px; font-weight: 600; fill: var(--ink); }
.seq-lane-type { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink-4); }
.seq-lane-line { stroke: var(--line-2); stroke-dasharray: 3 4; }
.seq-step-line { stroke: var(--seq-line); stroke-width: 1.3; }
.seq-step-line.hot { stroke: var(--seq-hot); stroke-width: 2; }
.seq-num { fill: var(--seq-num); font-size: 10px; font-weight: 700; font-family: var(--mono); }
.seq-num-bg { fill: var(--seq-num-bg); stroke: var(--seq-num-stroke); stroke-width: 1.2; }
.seq-label { font-size: 11px; fill: var(--ink-2); paint-order: stroke; stroke: var(--seq-label-halo); stroke-width: 4px; }
#flowsteps { position: absolute; left: 0; right: 0; bottom: 0; background: var(--flowsteps-bg); backdrop-filter: blur(8px); border-top: 1px solid var(--line); max-height: 42%; overflow-y: auto; padding: 16px 26px 22px; }
#flowsteps .fs-title { font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 10px; }
.fstep { display: flex; gap: 13px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background .12s; }
.fstep:hover, .fstep.hot { background: var(--bg-hover); }
.fstep .fs-n {
  flex: none; width: 21px; height: 21px; border-radius: 50%;
  border: 1.2px solid var(--ink); color: var(--ink);
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; margin-top: 1px;
}
.fstep .fs-t { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; }
.fstep .fs-t b { color: var(--ink); font-weight: 600; }
.fstep .fs-t code { font-family: var(--mono); font-size: 11px; background: var(--bg-hover); border-radius: 4px; padding: 0 4px; }

/* ---------- 设计原则视图 ---------- */
#principles { flex: 1; overflow-y: auto; display: none; padding: 34px 40px 60px; }
#principles.on { display: block; }
#principles .p-intro { max-width: 720px; margin-bottom: 30px; }
#principles .p-intro h2 { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin-bottom: 8px; }
#principles .p-intro p { font-size: 13.5px; color: var(--ink-3); line-height: 1.75; }
#p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; max-width: 1200px; }
.p-card {
  border: 1px solid var(--line-2); border-radius: 13px; padding: 20px 22px;
  transition: all .15s ease; background: var(--bg);
  display: flex; flex-direction: column; gap: 10px;
}
.p-card:hover { border-color: var(--line-3); box-shadow: var(--shadow-1); transform: translateY(-1px); }
.p-card .p-idx { font-family: var(--mono); font-size: 10px; color: var(--ink-4); letter-spacing: .08em; }
.p-card h3 { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
.p-card .p-body { font-size: 12.5px; color: var(--ink-2); line-height: 1.75; }
.p-card .p-evi { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); background: var(--bg-subtle); border: 1px solid var(--line); border-radius: 7px; padding: 8px 11px; line-height: 1.7; overflow-wrap: anywhere; }
.p-card .p-refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.p-card.debt { border-style: dashed; }
.p-card.debt h3 { color: var(--ink-2); }

/* ---------- 搜索 ---------- */
#search-ovl {
  position: fixed; inset: 0; z-index: 60;
  background: var(--search-ovl-bg); backdrop-filter: blur(6px);
  display: none; align-items: flex-start; justify-content: center; padding-top: 12vh;
}
#search-ovl.on { display: flex; }
#search-box {
  width: 560px; max-width: 92vw;
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 14px;
  box-shadow: var(--shadow-2); overflow: hidden;
}
#search-input {
  width: 100%; height: 52px; border: none; outline: none;
  padding: 0 20px; font-size: 15px; font-family: var(--sans); color: var(--ink);
  border-bottom: 1px solid var(--line);
}
#search-input::placeholder { color: var(--ink-4); }
#search-results { max-height: 46vh; overflow-y: auto; padding: 8px; }
.sr {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 9px; cursor: pointer;
}
.sr:hover, .sr.hot { background: var(--bg-hover); }
.sr .sr-name { font-size: 13px; font-weight: 550; }
.sr .sr-kind { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; flex: none; }
.sr .sr-tag { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr .sr-view { margin-left: auto; font-size: 10px; color: var(--ink-4); flex: none; font-family: var(--mono); }
#search-empty { padding: 26px; text-align: center; font-size: 12.5px; color: var(--ink-4); }

/* 滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 900px) {
  #sidebar { display: none; }
  #drawer { width: min(var(--drawer-w), 92vw); }
}
</style>
</head>
<body>
<div id="app">
  <!-- 侧边导航:品牌区由 app.js 从 ATLAS.meta 注入,无需改这里 -->
  <aside id="sidebar">
    <div class="brand">
      <div class="mark"><span class="dot">AZ</span><span>架构大图</span></div>
      <div class="sub">Architecture Atlas</div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">
      <span>本体论建模 · 实体 / 关系 / 数据流</span>
      <span class="stats" id="foot-stats"></span>
    </div>
  </aside>

  <!-- 主区 -->
  <div id="main">
    <div id="topbar">
      <div id="view-title-wrap">
        <div id="crumbs"></div>
        <div id="view-title"></div>
        <div id="view-desc"></div>
      </div>
      <div class="spacer"></div>
      <label class="theme-ctl" title="主题">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <select id="theme-sel" aria-label="主题">
          <option value="light">浅色</option>
          <option value="dark">深色</option>
          <option value="paper">纸面</option>
          <option value="sepia">暖黄</option>
        </select>
      </label>
      <button class="top-btn" id="btn-search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        搜索实体 <kbd>⌘K</kbd>
      </button>
    </div>

    <div id="stage">
      <div id="dotgrid"></div>
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="legend" class="fab"></div>
      <div id="zoomctl" class="fab">
        <button id="zoom-out" title="缩小">−</button>
        <span class="zoom-val" id="zoom-val" title="适应窗口">100%</span>
        <button id="zoom-in" title="放大">+</button>
        <button id="zoom-fit" title="适应窗口" style="font-size:11px">Fit</button>
      </div>
    </div>

    <div id="flowwrap">
      <div id="flowlist"></div>
      <div id="flowstage">
        <svg id="flowcanvas" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="flowsteps"></div>
      </div>
    </div>

    <div id="principles"></div>

    <!-- 详情抽屉 -->
    <div id="drawer">
      <button id="drawer-close" title="关闭 (Esc)">✕</button>
      <div id="drawer-head">
        <div class="d-types" id="drawer-chips"></div>
        <div id="drawer-title"></div>
        <div id="drawer-tagline"></div>
      </div>
      <div id="drawer-body"></div>
      <div id="drawer-actions"></div>
    </div>
  </div>
</div>

<!-- 搜索浮层 -->
<div id="search-ovl">
  <div id="search-box">
    <input id="search-input" type="text" placeholder="搜索实体、类名、文件路径、协议…" autocomplete="off" spellcheck="false">
    <div id="search-results"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
